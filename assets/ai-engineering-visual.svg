<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">AI engineering systems visual</title>
  <desc id="desc">Abstract neural network and automation dashboard visual for an AI engineering portfolio.</desc>
  <defs>
